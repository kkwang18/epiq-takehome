services:
  postgres:
    image: postgres:16-alpine
    container_name: intake-postgres
    environment:
      POSTGRES_USER: intake
      POSTGRES_PASSWORD: intake
      POSTGRES_DB: intake
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intake"]
      interval: 2s
      timeout: 2s
      retries: 30
